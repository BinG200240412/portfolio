 y="672.18" width="106.88" height="67.73" clip-path="url(#q-component-6411)"/><defs><clipPath id="q-component-6381"><rect x="878.48" y="841.19" width="106.88" height="80.28" rx="8"/></clipPath></defs><image href="../assets/works/qianli/case/native/component-6381.webp" x="878.48" y="841.19" width="106.88" height="80.28" clip-path="url(#q-component-6381)"/><defs><clipPath id="q-component-6385"><rect x="1343.44" y="314.24" width="97.68" height="63.76" rx="8"/></clipPath></defs><image href="../assets/works/qianli/case/native/component-6385.webp" x="1343.44" y="314.24" width="97.68" height="64.19" clip-path="url(#q-component-6385)"/><g fill="none" stroke="#548775" stroke-width="3"><path d="M790 365v-22q0-8 6-8t6 8v12l3-6q3-5 7 0l2 5q6-8 10 0v20q0 12-13 16h-12l-13-15q-5-7 0-10t9 7"/></g><g fill="#397965" font-family="monospace" font-size="14"><text x="789" y="512">touch → n</text><text x="789" y="529">LED[n]</text><text x="789" y="546">show()</text></g><text class="q-native-label" x="399.87" y="358.28" font-size="21.3" fill="#41403d">通过触摸预先布置</text><text class="q-native-label" x="399.87" y="384.28" font-size="21.3" fill="#41403d">在装置表面的触摸</text><text class="q-native-label" x="399.87" y="410.28" font-size="21.3" fill="#41403d">传感器以来点亮相</text><text class="q-native-label" x="399.87" y="436.28" font-size="21.3" fill="#41403d">关区域光点。</text><text class="q-native-label" x="617.74" y="414.26" font-size="21.3" fill="#41403d">触摸点</text><text class="q-native-label" x="1339.4" y="408.75" font-size="21.3" fill="#41403d">单片机布线</text><text class="q-native-label" x="779.87" y="412.45" font-size="21.3" fill="#41403d">触摸</text><text class="q-native-label" x="1268.39" y="583.34" font-size="21.3" fill="#41403d">触摸传感器</text><text class="q-native-label" x="1006.94" y="590.58" font-size="21.3" fill="#41403d">ARDUINO单片机</text><text class="q-native-label" x="774.53" y="592.43" font-size="21.3" fill="#41403d">ARDUINO代码</text><text class="q-native-label" x="571.13" y="619.11" font-size="21.3" fill="#41403d">LED灯带</text><text class="q-native-label" x="1258.03" y="770.15" font-size="21.3" fill="#41403d">传感器分布</text><text class="q-native-label" x="1091.37" y="772.84" font-size="21.3" fill="#41403d">光纤</text><text class="q-native-label" x="814.68" y="787.11" font-size="21.3" fill="#41403d">光纤穿孔</text><text class="q-native-label" x="551.2" y="788.34" font-size="21.3" fill="#41403d">光纤打组</text><text class="q-native-label" x="399.29" y="864.63" font-size="21.3" fill="#41403d">把连接在前方区域的光纤打</text><text class="q-native-label" x="399.29" y="890.63" font-size="21.3" fill="#41403d">组，捆在相应灯珠前，以一</text><text class="q-native-label" x="399.29" y="916.63" font-size="21.3" fill="#41403d">个灯珠控制一块区域的光</text><text class="q-native-label" x="399.29" y="942.63" font-size="21.3" fill="#41403d">纤。</text><text class="q-native-label" x="1101.02" y="873.66" font-size="21.3" fill="#41403d">通过ARDUINO单片机数字信号来对led灯</text><text class="q-native-label" x="1101.02" y="899.66" font-size="21.3" fill="#41403d">组进行设置，实现对区域光纤的颜色控</text><text class="q-native-label" x="1101.02" y="925.66" font-size="21.3" fill="#41403d">制。达到多层次多色彩的效果。</text><text class="q-native-label" x="887.88" y="946.77" font-size="21.3" fill="#41403d">光纤导光</text><path class="q-circuit-signal" d="M800 350C1060 350 1070 520 1170 520H1320C1510 520 1510 715 1320 715H590C350 715 380 560 590 555L1080 520" fill="none" stroke="#397e69" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 49" opacity=".65"/></svg>