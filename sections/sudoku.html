<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="../assets/i18n.js?v=bilingual-20261023"></script>

<meta name="description" content="Sudoku.2026：变化的数独点阵与原生绿色界面。">
<title>Sudoku — 原生数独</title>
<style>
:root,[data-theme="dark"]{color-scheme:dark;--paper:#111210;--ink:#f0f0e8;--mid:#b8bab0;--soft:#83877b;--line:#34372f;--surface:#1b1d18;--accent:#b7bb9f;--photo-paper:#f4f1ea;--sans:"Noto Sans SC",sans-serif;--serif:Georgia,serif;--mono:monospace}
[data-theme="light"]{color-scheme:light;--paper:#f5f4ed;--ink:#24261f;--mid:#666b5d;--soft:#8c9182;--line:#d6d8cb;--surface:#e9eade;--accent:#626c49}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.85 var(--sans);-webkit-font-smoothing:antialiased}h1,h2,p,figure{margin:0}button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}a{color:inherit;text-decoration:none}a:focus-visible,button:focus-visible{outline:1px solid var(--ink);outline-offset:7px}::selection{background:var(--ink);color:var(--paper)}
.media-viewer{border:0;padding:0;background:var(--paper);color:var(--ink);max-width:none;max-height:none;width:100%;height:100%;margin:0;position:fixed;inset:0;overflow:auto}.media-viewer::backdrop{background:#000a}.viewer-bar{height:74px;position:sticky;top:0;z-index:2;background:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:0 28px;gap:24px;border-bottom:1px solid var(--line)}#viewer-caption{font-size:11px;color:var(--mid)}.viewer-close{width:44px;height:44px;display:grid;place-items:center;font:28px/1 var(--mono)}.viewer-image{display:flex;justify-content:center;padding:30px 24px 50px;min-height:calc(100% - 74px)}.viewer-image img{width:auto;max-width:100%;height:auto;object-fit:contain;align-self:flex-start}.viewer-image.is-screen img{width:min(440px,100%)}
@media(max-width:720px){.viewer-bar{height:66px;padding-inline:20px}.viewer-image{padding:20px 15px 35px;min-height:calc(100% - 66px)}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
<link rel="stylesheet" href="../assets/theme.css?v=lanting-light-20261024">
<link rel="stylesheet" href="../assets/sudoku-hero.css?v=living-fullscreen-20261024">
</head>
<body>
<main class="sudoku-scenes">
  <section class="hero" aria-labelledby="project-title">
    <div class="sudoku-hero-art" aria-hidden="true" data-i18n-ignore><div class="sudoku-board-angle"><canvas id="sudoku-hero-matrix" aria-hidden="true"></canvas></div></div>
    <div class="hero-main"><h1 id="project-title">sudoku<span>.</span></h1><p class="hero-line">凡事有解。</p></div>
  </section>
  <section class="sudoku-gallery" id="sudoku-gallery" aria-labelledby="product-heading" data-i18n-ignore>
    <div class="sudoku-gallery-copy">
      <h2 id="product-heading">界面与交互</h2><p>棋盘、笔记与分步辅导。</p>
      <div class="sudoku-screen-tabs" role="group" aria-label="界面与交互">
        <button class="sudoku-screen-tab" type="button" data-screen="board" data-image="../assets/works/sudoku/board.png?v=green-20261024" data-caption="主棋盘" data-alt="数独主棋盘，鼠尾草绿色进度条与输入工具" aria-pressed="true">主棋盘</button>
        <button class="sudoku-screen-tab" type="button" data-screen="coach" data-image="../assets/works/sudoku/coach.png?v=green-20261024" data-caption="分步辅导" data-alt="离线分步辅导，用绿色框线标出隐性唯一的目标行和格子" aria-pressed="false">分步辅导</button>
        <button class="sudoku-screen-tab" type="button" data-screen="settings" data-image="../assets/works/sudoku/settings.png?v=green-20261024" data-caption="设置" data-alt="数独设置页面" aria-pressed="false">设置</button>
        <button class="sudoku-screen-tab" type="button" data-screen="classics" data-image="../assets/works/sudoku/classics.png?v=green-20261024" data-caption="经典残局" data-alt="经典残局题库页面" aria-pressed="false">经典残局</button>
        <button class="sudoku-screen-tab" type="button" data-screen="share" data-image="../assets/works/sudoku/share.png?v=green-20261024" data-caption="分享残局" data-alt="分享残局页面，显示当前盘面预览和发送给朋友按钮" aria-pressed="false">分享残局</button>
      </div>
      <p id="sudoku-gallery-status" role="status" aria-live="polite" hidden></p>
    </div>
    <figure class="sudoku-gallery-figure">
      <button class="image-open" id="sudoku-active-open" type="button" data-image="../assets/works/sudoku/board.png?v=green-20261024" data-caption="主棋盘" data-kind="screen" aria-label="放大查看主棋盘截图"><img id="sudoku-active-image" src="../assets/works/sudoku/board.png?v=green-20261024" width="1320" height="2868" alt="数独主棋盘，鼠尾草绿色进度条与输入工具" decoding="async"></button>
      <figcaption id="sudoku-active-caption">主棋盘</figcaption>
    </figure>
  </section>
  <footer class="sudoku-scene-footer"><a class="case-link" href="sudoku-visual.html">视觉系统 ↗</a></footer>
</main>
<dialog class="media-viewer" id="media-viewer" aria-labelledby="viewer-caption"><div class="viewer-bar"><p id="viewer-caption"></p><button class="viewer-close" aria-label="关闭大图">×</button></div><div class="viewer-image" id="viewer-image"></div></dialog>
<script>
(() => {
  const viewer=document.getElementById("media-viewer"),target=document.getElementById("viewer-image"),caption=document.getElementById("viewer-caption");
  let trigger=null,previousOverflow="";
  document.querySelectorAll(".image-open").forEach(button=>button.addEventListener("click",()=>{
    trigger=button;
    const source=button.querySelector("img"),image=new Image();
    image.src=button.dataset.image;image.alt=source.alt;
    target.replaceChildren(image);target.className="viewer-image is-"+button.dataset.kind;
    caption.textContent=button.dataset.caption;
    previousOverflow=document.body.style.overflow;document.body.style.overflow="hidden";
    viewer.showModal();viewer.scrollTop=0;viewer.querySelector("button").focus({preventScroll:true});
  }));
  viewer.querySelector("button").addEventListener("click",()=>viewer.close());
  viewer.addEventListener("close",()=>{document.body.style.overflow=previousOverflow;target.replaceChildren();trigger?.focus({preventScroll:true});});
})();
</script>
</body>
</html>
