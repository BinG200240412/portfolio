<script data-portfolio-first-paint>
(() => {
  const root=document.documentElement, query=new URLSearchParams(location.search);
  let theme='dark', language='zh';
  try { theme=localStorage.getItem('portfolio-theme')||theme; language=localStorage.getItem('portfolio-language')||language; } catch (_) {}
  root.dataset.theme=theme==='light'?'light':'dark'; root.style.colorScheme=root.dataset.theme;
  const requested=query.get('lang'); if(requested==='zh'||requested==='en')language=requested;
  root.lang=language==='en'?'en':'zh-CN'; root.dataset.language=language==='en'?'en':'zh';
  const font=query.get('cjk'); if(font==='plix'||font==='plix-extra')root.dataset.cjkPreview=font;
})();
</script>
