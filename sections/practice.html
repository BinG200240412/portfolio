<script data-portfolio-first-paint>

  const requested=query.get('lang'); if(requested==='zh'||requested==='en')language=requested;
  root.lang=language==='en'?'en':'zh-CN'; root.dataset.language=language==='en'?'en':'zh';
  const font=query.get('cjk'); if(font==='plix'||font==='plix-extra')root.dataset.cjkPreview=font;
})();
</script>
